  <!-- Подписи -->
  <text x="188" y="240" font-size="13" fill="#1f2937">0</text>
  <text x="224" y="240" font-size="13" fill="#1f2937">1</text>
  <text x="178" y="168" font-size="13" fill="#1f2937">2</text>
  <text x="172" y="252" font-size="13" fill="#1f2937">−1</text>

  <!-- Гипербола y = -3/x - 1 -->
  <polyline points="32,234 60,231.2 88,227 116,220 144,206 158,192 172,164 179,136 186,80"
