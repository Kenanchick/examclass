<svg width="400" height="320" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Нижнее основание (задние рёбра пунктиром) -->
  <line x1="80" y1="280" x2="180" y2="220" stroke="#1f2937" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="280" y1="280" x2="180" y2="220" stroke="#1f2937" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="80" y1="280" x2="280" y2="280" stroke="#1f2937" stroke-width="2"/>

  <!-- Боковые рёбра -->
  <line x1="80" y1="280" x2="80" y2="120" stroke="#1f2937" stroke-width="2"/>
  <line x1="280" y1="280" x2="280" y2="120" stroke="#1f2937" stroke-width="2"/>
  <line x1="180" y1="220" x2="180" y2="60" stroke="#1f2937" stroke-width="1.8"/>

  <!-- Верхнее основание -->
  <polygon points="80,120 280,120 180,60" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Секущая плоскость -->
  <polygon points="180,280 130,250 130,90 180,120" fill="rgba(225,29,72,0.08)"/>
  <line x1="180" y1="280" x2="180" y2="120" stroke="#e11d48" stroke-width="1.5"/>
  <line x1="130" y1="250" x2="130" y2="90" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Обозначения сторон и высоты -->
  <text x="195" y="302" font-size="16" fill="#be123c" font-style="italic">a</text>
  <text x="96" y="252" font-size="16" fill="#059669" font-style="italic">b</text>
  <text x="126" y="110" font-size="15" fill="#7c3aed" font-style="italic">c/2</text>
  <text x="238" y="110" font-size="16" fill="#7c3aed" font-style="italic">c</text>
  <text x="292" y="205" font-size="16" fill="#2563eb" font-style="italic">h</text>
  <text x="188" y="200" font-size="16" fill="#2563eb" font-style="italic">h</text>
</svg>
