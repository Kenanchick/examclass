  <!-- Ось Y -->
  <line x1="200" y1="340" x2="200" y2="14" stroke="#1f2937" stroke-width="1.8"/>
  <polygon points="200,14 195,24 205,24" fill="#1f2937"/>
  <text x="210" y="26" font-size="15" fill="#1f2937" font-style="italic">y</text>

  <!-- Подписи -->
  <text x="188" y="240" font-size="13" fill="#1f2937">0</text>
  <text x="224" y="240" font-size="13" fill="#1f2937">1</text>
  <text x="106" y="240" font-size="13" fill="#1f2937">−3</text>
  <text x="178" y="140" font-size="13" fill="#1f2937">3</text>
  <text x="178" y="168" font-size="13" fill="#1f2937">2</text>

  <!-- Гипербола y = -3/x + 2 -->
  <polyline points="32,150 60,147.2 88,143 116,136 130,130.4 144,122 158,108 172,80 177.6,59"
