  <!-- Асимптота y = 2 -->
  <line x1="32" y1="164" x2="368" y2="164" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>

  <!-- Ось X -->
  <line x1="24" y1="220" x2="382" y2="220" stroke="#1f2937" stroke-width="1.8"/>
