<svg width="400" height="320" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Нижнее основание: задняя дуга пунктиром, передняя сплошная -->
  <path d="M 100 260 A 100 25 0 0 1 300 260" fill="none" stroke="#1f2937" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M 100 260 A 100 25 0 0 0 300 260" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Верхнее основание -->
  <ellipse cx="200" cy="80" rx="100" ry="25" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Образующие -->
  <line x1="100" y1="80" x2="100" y2="260" stroke="#1f2937" stroke-width="2"/>
  <line x1="300" y1="80" x2="300" y2="260" stroke="#1f2937" stroke-width="2"/>
</svg>
