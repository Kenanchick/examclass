<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Окружность -->
  <circle cx="200" cy="150" r="100" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Дуга BC, на которую опирается вписанный угол (нижняя) -->
  <path d="M 113 200 A 100 100 0 0 0 287 200" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Радиусы OB и OC (центральный угол) -->
  <line x1="200" y1="150" x2="287" y2="200" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="200" y1="150" x2="113" y2="200" stroke="#7c3aed" stroke-width="1.8"/>

  <!-- Маркер центрального угла при O -->
  <path d="M 184.3 159 A 18 18 0 0 0 215.7 159" fill="none" stroke="#7c3aed" stroke-width="1.8"/>

  <!-- Стороны вписанного угла -->
  <line x1="200" y1="50" x2="287" y2="200" stroke="#059669" stroke-width="2"/>
  <line x1="200" y1="50" x2="113" y2="200" stroke="#059669" stroke-width="2"/>

  <!-- Маркер вписанного угла при A -->
  <path d="M 189 69 A 22 22 0 0 0 211 69" fill="none" stroke="#059669" stroke-width="1.8"/>

  <!-- Центр окружности -->
  <circle cx="200" cy="150" r="3.5" fill="#1f2937"/>
  <text x="208" y="145" font-size="15" fill="#1f2937" font-weight="bold">O</text>

  <!-- Вершины -->
  <circle cx="200" cy="50" r="4" fill="#059669"/>
  <text x="193" y="36" font-size="15" fill="#1f2937" font-weight="bold">A</text>

  <circle cx="287" cy="200" r="4" fill="#059669"/>
  <text x="297" y="208" font-size="15" fill="#1f2937" font-weight="bold">B</text>

  <circle cx="113" cy="200" r="4" fill="#059669"/>
  <text x="96" y="208" font-size="15" fill="#1f2937" font-weight="bold">C</text>
</svg>
