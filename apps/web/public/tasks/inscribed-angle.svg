<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Окружность -->
  <circle cx="200" cy="150" r="100" fill="none" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Центр -->
  <circle cx="200" cy="150" r="3" fill="#dc2626"/>
  <text x="205" y="145" font-size="14" fill="#1f2937">O</text>
  
  <!-- Вписанный угол BAC -->
  <circle cx="200" cy="50" r="4" fill="#059669"/>
  <text x="195" y="35" font-size="14" fill="#1f2937" font-weight="bold">A</text>
  
  <circle cx="287" cy="200" r="4" fill="#059669"/>
  <text x="295" y="210" font-size="14" fill="#1f2937" font-weight="bold">B</text>
  
  <circle cx="113" cy="200" r="4" fill="#059669"/>
