  <line x1="200" y1="50" x2="113" y2="200" stroke="#059669" stroke-width="2"/>
  
  <!-- Дуга BC -->
  <path d="M 113 200 A 100 100 0 0 1 287 200" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,3"/>
  
