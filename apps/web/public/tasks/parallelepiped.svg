<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Задняя грань (скрытые линии) -->
  <line x1="100" y1="100" x2="300" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="100" y1="100" x2="100" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="300" y1="100" x2="300" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <!-- Передняя грань -->
  <polygon points="100,250 300,250 300,100 100,100" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  
  <!-- Задняя грань (видимые линии) -->
  <line x1="100" y1="100" x2="150" y2="50" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="100" x2="350" y2="50" stroke="#2563eb" stroke-width="2"/>
  <line x1="150" y1="50" x2="350" y2="50" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="250" x2="350" y2="200" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Верхняя грань -->
  <line x1="150" y1="50" x2="150" y2="200" stroke="#2563eb" stroke-width="2"/>
  <line x1="350" y1="50" x2="350" y2="200" stroke="#2563eb" stroke-width="2"/>
  <line x1="150" y1="200" x2="350" y2="200" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Диагональ -->
  <line x1="100" y1="250" x2="350" y2="50" stroke="#dc2626" stroke-width="3"/>
  
  <!-- Вершины -->
  <text x="85" y="265" font-size="14" fill="#1f2937" font-weight="bold">A</text>
  <text x="305" y="265" font-size="14" fill="#1f2937" font-weight="bold">B</text>
  <text x="305" y="105" font-size="14" fill="#1f2937" font-weight="bold">C</text>
  <text x="85" y="105" font-size="14" fill="#1f2937" font-weight="bold">D</text>
  <text x="355" y="55" font-size="14" fill="#1f2937" font-weight="bold">E</text>
  
  <!-- Размеры -->
  <text x="180" y="270" font-size="13" fill="#059669">a = 3</text>
  <text x="315" y="180" font-size="13" fill="#059669">b = 4</text>
  <text x="315" y="120" font-size="13" fill="#059669">c = 5</text>
  <text x="200" y="140" font-size="14" fill="#dc2626" font-weight="bold">d = ?</text>
</svg>
