<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Прямоугольный треугольник -->
  <polygon points="100,250 300,250 300,50" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  
  <!-- Прямой угол -->
  <rect x="290" y="240" width="15" height="15" fill="none" stroke="#dc2626" stroke-width="2"/>
  
  <!-- Вершины -->
  <text x="85" y="265" font-size="16" fill="#1f2937" font-weight="bold">A</text>
  <text x="310" y="265" font-size="16" fill="#1f2937" font-weight="bold">B</text>
  <text x="310" y="45" font-size="16" fill="#1f2937" font-weight="bold">C</text>
  
  <!-- Стороны с обозначениями -->
  <text x="180" y="270" font-size="14" fill="#059669">a = 6</text>
  <text x="315" y="150" font-size="14" fill="#059669">b = 8</text>
  <text x="175" y="140" font-size="14" fill="#dc2626" font-weight="bold">c = ?</text>
  
  <!-- Гипотенуза выделена -->
  <line x1="100" y1="250" x2="300" y2="50" stroke="#dc2626" stroke-width="3"/>
</svg>
